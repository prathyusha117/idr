<svg width="380" height="80" viewBox="0 0 380 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&amp;display=swap');
    </style>
  </defs>
  <!-- Icon: outer hexagon -->
  <polygon points="40,6 70,23 70,57 40,74 10,57 10,23"
    fill="none" stroke="#FF6A00" stroke-width="2.8"/>
  <!-- Icon: inner hexagon -->
  <polygon points="40,18 60,29 60,51 40,62 20,51 20,29"
    fill="none" stroke="#FF6A00" stroke-width="1.2" opacity="0.4"/>
  <!-- Cube top face -->
  <polygon points="40,22 54,30 40,38 26,30"
    fill="#FF6A00" opacity="0.95"/>
  <!-- Cube left face -->
  <polygon points="26,30 40,38 40,54 26,46"
    fill="#FF6A00" opacity="0.5"/>
  <!-- Cube right face -->
  <polygon points="54,30 40,38 40,54 54,46"
    fill="#FF6A00" opacity="0.7"/>
  <!-- Wordmark: IDR -->
  <text x="90" y="36" font-family="'Syne', Arial, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF" letter-spacing="6">IDR</text>
  <!-- Divider line -->
  <line x1="90" y1="44" x2="210" y2="44" stroke="#FF6A00" stroke-width="1" opacity="0.5"/>
  <!-- Full name -->
  <text x="90" y="60" font-family="'Syne', Arial, sans-serif" font-size="11" font-weight="600" fill="#8A97AD" letter-spacing="2.5">INSTITUTE OF DIGITAL RISK</text>
</svg>
